# Collecte quotidienne des parties Talishar (FaB Insights) → Supabase Storage (bucket privé meta-games).
# Secrets requis : FABINSIGHTS_API_KEY, SUPABASE_SECRET_KEY.
name: Collecte méta FaB Insights

on:
  schedule:
    - cron: '37 4 * * *'   # chaque nuit (UTC) : la veille d'abord, puis comble les trous des 90 derniers jours (~10 jours/nuit, quota API)
  workflow_dispatch:
    inputs:
      since:
        description: 'Premier jour à collecter (AAAA-MM-JJ) — borné par la rétention'
        default: '2025-06-01'
      formats:
        description: 'Codes FaB Insights (0 = CC, 1 = CC compétitif, 2 = Blitz…)'
        default: '0,1'
      keep_days:
        description: 'Rétention en jours (plus ancien = supprimé du bucket)'
        default: '90'

concurrency:
  group: meta-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter
        env:
          FABINSIGHTS_API_KEY: ${{ secrets.FABINSIGHTS_API_KEY }}
          SUPABASE_URL: https://alzldgpopmhxnlxafsrl.supabase.co
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SECRET_KEY }}
        run: |
          python scripts/meta_collect.py \
            --since "${{ inputs.since || '2025-06-01' }}" \
            --formats "${{ inputs.formats || '0,1' }}" \
            --keep-days "${{ inputs.keep_days || '90' }}"
