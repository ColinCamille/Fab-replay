# Collecte quotidienne des parties Talishar (FaB Insights) → Supabase Storage (bucket privé meta-games).
# Secrets requis : FABINSIGHTS_API_KEY, SUPABASE_SERVICE_ROLE_KEY.
name: Collecte méta FaB Insights

on:
  schedule:
    - cron: '37 4 * * *'   # chaque nuit (UTC) : collecte la veille + comble les trous
  workflow_dispatch:
    inputs:
      since:
        description: 'Premier jour à collecter (AAAA-MM-JJ)'
        default: '2026-09-25'
      formats:
        description: 'Codes FaB Insights (0 = CC, 1 = CC compétitif, 2 = Blitz…)'
        default: '0,1'

concurrency:
  group: meta-collect
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Collecter
        env:
          FABINSIGHTS_API_KEY: ${{ secrets.FABINSIGHTS_API_KEY }}
          SUPABASE_URL: https://alzldgpopmhxnlxafsrl.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          python scripts/meta_collect.py \
            --since "${{ inputs.since || '2026-09-25' }}" \
            --formats "${{ inputs.formats || '0,1' }}"
